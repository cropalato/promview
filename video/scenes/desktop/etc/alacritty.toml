# The terminal the compact window sits over. Nord.
[window]
padding = { x = 14, y = 10 }
decorations = "Full"
dimensions = { columns = 132, lines = 34 }
[font]
normal = { family = "JetBrains Mono" }
size = 11
[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"
[colors.normal]
black = "#3b4252"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"
