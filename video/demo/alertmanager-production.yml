# Alertmanager for the "production" demo source. Routes everything to Promview and
# nowhere else; the short waits are so an injected alert reaches the console
# inside the scene that injects it.
route:
  receiver: promview
  group_by: ["alertname"]
  group_wait: 1s
  group_interval: 5s
  repeat_interval: 1h

receivers:
  - name: promview
    webhook_configs:
      - url: http://app:8080/api/v1/ingest/alertmanager/production
        send_resolved: true
        max_alerts: 0
        http_config:
          authorization:
            type: Bearer
            credentials: video-production-token-2026
