name: Video

# Renders the product videos from scratch: the demo stack, the console
# scenes under a virtual display, the desktop client inside a sandbox desktop,
# the cards, the music, and the assembly. On demand only: it takes the better
# part of half an hour and produces artifacts, not a verdict. The parts that
# can be verified quickly run in CI as `make video-check`.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            video/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Install the render and sandbox-desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            ffmpeg xvfb fonts-jetbrains-mono \
            openbox tint2 dunst xdotool alacritty dbus x11-xserver-utils x11-utils \
            valac libdbusmenu-gtk3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      # The tray bridge is packaged by Debian and Arch but not Ubuntu, and it
      # is a few hundred lines of Vala: built from the pinned release.
      - name: Build snixembed
        run: |
          curl -fsSL https://git.sr.ht/~steef/snixembed/archive/0.3.3.tar.gz | tar xz
          cd snixembed-0.3.3
          make
          sudo make install
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: video
      - run: npx playwright install --with-deps chromium
        working-directory: video
      - name: Build the console and the desktop client
        run: |
          npm --prefix web run build
          cd desktop/src-tauri && cargo build --release --features tauri/custom-protocol
      - run: make video-demo-up
      - run: make video-capture-web
      - run: make video-capture-desktop
      - run: make video-assemble TARGET=v2
      - run: make video-assemble TARGET=v3
      - run: make video-assemble TARGET=v1
      - run: make video-assemble TARGET=gifs
      - uses: actions/upload-artifact@v7
        with:
          name: promview-videos
          path: |
            video/out/v1.mp4
            video/out/v2.mp4
            video/out/v3.mp4
            video/out/gif/*.gif
          if-no-files-found: error
      - if: always()
        run: make video-demo-down
