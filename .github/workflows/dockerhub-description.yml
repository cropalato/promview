name: Docker Hub description

# The Hub listing is the first thing anyone pulling the image reads, and it is
# the one artifact nothing in this repository used to own. It drifted: it
# advertised a username placeholder, a version 33 releases old, and arm64 images
# that have not been built since alpha.12. Sourcing it from a file in the tree
# means a wrong claim there is a diff like any other.
#
# Kept out of release.yml deliberately. A documentation fix should not wait for
# the next tag, and a failure to update prose should not paint a release red.
on:
  push:
    branches:
      - main
    paths:
      - docs/dockerhub.md
      - .github/workflows/dockerhub-description.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  description:
    runs-on: ubuntu-latest
    env:
      # The same access token the release job pushes images with. Docker Hub's
      # description endpoint takes a token-issued JWT, verified by updating this
      # repository's listing with one - so no second credential is needed. The
      # token does need write scope on the repository; a read-only one
      # authenticates and then fails the PATCH.
      #
      # An unset secret skips rather than fails: a fork has no credential and is
      # not a broken workflow.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - if: env.DOCKERHUB_TOKEN == ''
        run: echo "DOCKERHUB_TOKEN is not set; skipping the description update." >> "${GITHUB_STEP_SUMMARY}"

      - if: env.DOCKERHUB_TOKEN != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/promview
          readme-filepath: docs/dockerhub.md
          short-description: "Operational console for Prometheus Alertmanager alerts."
