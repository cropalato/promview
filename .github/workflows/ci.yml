name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify-go

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make verify-web

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri 2 links against the system webview and GTK; without these the
      # crate does not configure, let alone build.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: make verify-desktop

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promview_test
          POSTGRES_USER: promview
          POSTGRES_PASSWORD: promview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promview -d promview_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PROMVIEW_TEST_DATABASE_URL: postgres://promview:promview@localhost:5432/promview_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: make migration-check
      - run: make test-postgres

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make compose-check
      - run: make docker-build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - run: make verify-helm
