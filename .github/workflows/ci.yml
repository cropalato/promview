name: CI

# Unfiltered `push` plus `pull_request` ran every job twice for any branch with
# a pull request open on it. Commits land on main here, so that is the branch
# worth watching directly; everything else arrives as a pull request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A second push supersedes the first, except on main, where every commit is a
# state someone may later bisect to and deserves its own answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make verify-go

  # Separate from `go` so a data race reports as a data race rather than as
  # "the Go job failed", and so the slower race build does not hold up the
  # ordinary test signal.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-race

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make verify-web

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Tauri 2 links against the system webview and GTK; without these the
      # crate does not configure, let alone build.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: make verify-desktop

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: promview_test
          POSTGRES_USER: promview
          POSTGRES_PASSWORD: promview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promview -d promview_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PROMVIEW_TEST_DATABASE_URL: postgres://promview:promview@localhost:5432/promview_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: make migration-check
      - run: make test-postgres

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make compose-check
      - run: make docker-build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - run: make verify-helm

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make changelog-check
      - run: make docs-check

  # Advisory scanning across all four toolchains. Deliberately one job: an
  # advisory is an advisory whichever manifest it arrives through, and three
  # separate red jobs would say the same thing three times.
  #
  # This is the check that found pgx and go-jose vulnerabilities reachable from
  # the migration runner and the OIDC token verifier, and a rustls one two days
  # after it was published. Nothing was watching before it existed.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make vuln-go

      # npm audit resolves from the lockfile, so neither project needs
      # installing to be scanned.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make vuln-web

      # cargo-audit reads Cargo.lock and never builds, so this needs no Rust
      # toolchain beyond cargo itself and none of the GTK system libraries the
      # desktop job installs.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: make vuln-desktop
