name: Release

on:
  push:
    tags:
      - "v*"
  # The desktop bundles are the one thing no other workflow builds: CI compiles
  # the Tauri crate but never packages it, and MSI and NSIS only exist on a
  # Windows runner. Without a way to run this deliberately, the first time a
  # packaging change is exercised is the release that depends on it. Publishing
  # stays tag-only; a manual run produces artifacts and nothing else.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the desktop bundles"
        required: false
        default: "0.0.0-dispatch.0"

permissions:
  # contents: write so the desktop installers can be attached to a release.
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    # A manual run exists to exercise packaging, not to ship anything.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU: releases are linux/amd64 only, deliberately, so there is no
      # foreign architecture to emulate.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/promview
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Package and publish Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          helm package charts/promview --destination build --version "${VERSION}" --app-version "${VERSION}"
          helm push "build/promview-${VERSION}.tgz" oci://ghcr.io/cropalato/charts

  # The desktop client, built where it will run. Cross-compiling a Tauri bundle
  # is not practical: each platform's installer format is produced by that
  # platform's own tooling.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # The bundle embeds the console, and tauri's beforeBuildCommand builds it.
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop

      # tauri.conf.json carries a fixed version so a working copy builds without
      # a tag. Leaving it there would name every installer after that version,
      # which is how alpha.29 and alpha.30 shipped as indistinguishable files.
      # The release version is stamped in here instead of committed, so no
      # release needs a commit that only moves a number.
      - name: Resolve the release version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION}"
          fi
          core="${version%%-*}"
          if [ "${core}" = "${version}" ]; then
            # A final release: nothing to encode anywhere.
            wix="${core}"
            rpm_release="1"
          else
            pre="${version#*-}"
            # MSI product versions are four numbers, so the pre-release has to
            # arrive as one. Its trailing counter is what actually distinguishes
            # two alphas; a pre-release without one contributes zero.
            build="${pre##*.}"
            case "${build}" in ''|*[!0-9]*) build=0 ;; esac
            wix="${core}.${build}"
            # RPM forbids a hyphen in Version - it is the name-version-release
            # separator - so the pre-release belongs in Release. The leading 0
            # is the Fedora convention that sorts a pre-release below the final
            # version rather than above it.
            rpm_release="0.${pre}"
          fi
          {
            echo "version=${version}"
            echo "core=${core}"
            echo "wix=${wix}"
            echo "rpm_release=${rpm_release}"
          } >> "${GITHUB_OUTPUT}"
          echo "version=${version} wix=${wix} rpm=${core}-${rpm_release}"

      - name: Stamp the version into the bundle configuration
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          WIX_VERSION: ${{ steps.version.outputs.wix }}
        run: |
          node -e '
            const fs = require("fs");
            const path = "desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.version = process.env.APP_VERSION;
            config.bundle = config.bundle || {};
            config.bundle.windows = config.bundle.windows || {};
            config.bundle.windows.wix = config.bundle.windows.wix || {};
            config.bundle.windows.wix.version = process.env.WIX_VERSION;
            fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          '

      # Linux builds the deb from the stamped configuration; Windows builds the
      # NSIS and MSI installers. Tauri skips the targets that do not belong to
      # the host, so one command covers both.
      - run: npm run build -- --bundles ${{ matrix.os == 'ubuntu-latest' && 'deb' || 'nsis,msi' }}
        working-directory: desktop

      # The RPM is built separately because it is the one format that cannot
      # carry the version as written. Overriding the two fields here rather
      # than in the stamped file keeps the deb and the installers on the exact
      # release version.
      - name: Bundle the RPM with an RPM-legal version
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          RPM_CORE: ${{ steps.version.outputs.core }}
          RPM_RELEASE: ${{ steps.version.outputs.rpm_release }}
        run: |
          set -eu
          config=$(node -e '
            console.log(JSON.stringify({
              version: process.env.RPM_CORE,
              bundle: { linux: { rpm: { release: process.env.RPM_RELEASE } } },
            }));
          ')
          npx tauri build --bundles rpm --config "${config}"
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # Arch has no Tauri bundle target — the CLI offers deb, rpm and appimage only
  # — so the deb is repackaged rather than built a second time. A second
  # from-source build could only disagree with the binary shipped everywhere
  # else.
  desktop-arch:
    needs: desktop
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: bundles

      - name: Build the package
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          pacman -Sy --noconfirm --needed libarchive
          # makepkg refuses to run as root, and a container has no other user.
          useradd --create-home builder
          install -d -o builder /work
          cp desktop/packaging/arch/PKGBUILD /work/
          cp bundles/deb/*.deb /work/promview-desktop.deb
          # The tag is the version; strip the leading v and any pre-release
          # suffix pacman would reject in pkgver. A manual run has no tag, so
          # it takes the version it was given, like the bundles it repackages.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${DISPATCH_VERSION}"
          fi
          sed -i "s/^pkgver=.*/pkgver=${version//-/_}/" /work/PKGBUILD
          chown -R builder /work
          su builder -c "cd /work && makepkg --nodeps --noconfirm"
          ls -l /work/*.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-arch
          if-no-files-found: error
          path: /work/*.pkg.tar.zst

  # A separate job so the two builds cannot race to create the same release.
  release:
    if: github.ref_type == 'tag'
    needs: [publish, desktop, desktop-arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # upload-artifact keeps the bundle's directory layout, so the files
          # sit one level down. Globbing the top level hands gh a directory.
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installers were produced" >&2
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          {
            printf 'Server image: `%s/%s:%s`\n' "ghcr.io" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
            printf 'Helm chart: `oci://ghcr.io/cropalato/charts/promview`\n\n'
            printf 'The desktop installers below are **unsigned**. Windows SmartScreen\n'
            printf 'warns on first run, and macOS is not built at all: signing needs\n'
            printf 'certificates this project does not have yet.\n'
          } > notes.md
          # Re-runnable: a release left behind by a failed upload is filled in
          # rather than colliding with a second create.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "${files[@]}"
          fi
