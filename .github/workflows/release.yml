name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # contents: write so the desktop installers can be attached to a release.
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No QEMU: releases are linux/amd64 only, deliberately, so there is no
      # foreign architecture to emulate.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/promview
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Package and publish Helm chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p build
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          helm package charts/promview --destination build --version "${VERSION}" --app-version "${VERSION}"
          helm push "build/promview-${VERSION}.tgz" oci://ghcr.io/cropalato/charts

  # The desktop client, built where it will run. Cross-compiling a Tauri bundle
  # is not practical: each platform's installer format is produced by that
  # platform's own tooling.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # The bundle embeds the console, and tauri's beforeBuildCommand builds it.
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  # A separate job so the two builds cannot race to create the same release.
  release:
    needs: [publish, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # upload-artifact keeps the bundle's directory layout, so the files
          # sit one level down. Globbing the top level hands gh a directory.
          mapfile -t files < <(find artifacts -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no installers were produced" >&2
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"
          {
            printf 'Server image: `%s/%s:%s`\n' "ghcr.io" "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}"
            printf 'Helm chart: `oci://ghcr.io/cropalato/charts/promview`\n\n'
            printf 'The desktop installers below are **unsigned**. Windows SmartScreen\n'
            printf 'warns on first run, and macOS is not built at all: signing needs\n'
            printf 'certificates this project does not have yet.\n'
          } > notes.md
          # Re-runnable: a release left behind by a failed upload is filled in
          # rather than colliding with a second create.
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file notes.md \
              "${files[@]}"
          fi
