auth:
  mode: ldap

ldap:
  url: ldaps://dc.corp.example.com:636
  bindDN: cn=promview,ou=service,dc=corp,dc=example,dc=com
  existingSecret: promview-ldap
  bindPasswordKey: bind-password
  baseDN: dc=corp,dc=example,dc=com
  userFilter: "(sAMAccountName=%s)"

database:
  existingSecret: promview-database

roleBindings:
  - name: promview-administrators
    role: administrator
    # Written in the same form the directory reports, which groupFormat decides.
    issuer: ldaps://dc.corp.example.com:636
    group: promview-administrators
