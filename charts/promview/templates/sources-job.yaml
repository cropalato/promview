{{- range $index, $source := .Values.sources }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-source-%d" (include "promview.fullname" $) $index | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "promview.labels" $ | nindent 4 }}
    app.kubernetes.io/component: sources
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $.Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ $.Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "promview.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: sources
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: source
          image: {{ include "promview.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - source
            - set
            - --slug
            - {{ required "sources[].slug is required" $source.slug | quote }}
            - --name
            - {{ default $source.slug $source.name | quote }}
            # The token never appears in the manifest: the kubelet expands
            # $(VAR) from the container's own environment, which reads it
            # from the Secret.
            - --token
            - $(PROMVIEW_SOURCE_TOKEN)
            {{- with $source.staleAfter }}
            - --stale-after
            - {{ . | quote }}
            {{- end }}
            {{- with $source.alertmanagerURL }}
            - --alertmanager-url
            - {{ . | quote }}
            {{- end }}
            {{- if $source.alertmanagerTokenKey }}
            - --alertmanager-token
            - $(PROMVIEW_SOURCE_ALERTMANAGER_TOKEN)
            {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          env:
            - name: PROMVIEW_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.existingSecret }}
                  key: {{ $.Values.database.urlKey }}
            - name: PROMVIEW_SOURCE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "sources[].existingSecret is required" $source.existingSecret }}
                  key: {{ default $source.slug $source.tokenKey }}
            {{- if $source.alertmanagerTokenKey }}
            - name: PROMVIEW_SOURCE_ALERTMANAGER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $source.existingSecret }}
                  key: {{ $source.alertmanagerTokenKey }}
            {{- end }}
          resources:
            {{- toYaml $.Values.migration.resources | nindent 12 }}
          {{- with $.Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
