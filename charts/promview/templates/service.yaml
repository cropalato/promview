apiVersion: v1
kind: Service
metadata:
  name: {{ include "promview.fullname" . }}
  labels:
    {{- include "promview.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    # Reachable inside the cluster so the operator can scrape it. The Ingress
    # routes to the port named "http" specifically, so naming another port here
    # does not publish it.
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "promview.selectorLabels" . | nindent 4 }}
