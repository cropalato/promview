{{- include "promview.validateValues" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "promview.fullname" . }}
  labels:
    {{- include "promview.labels" . | nindent 4 }}
data:
  PROMVIEW_AUTH_MODE: {{ .Values.auth.mode | quote }}
  PROMVIEW_ALERT_STALE_AFTER: {{ .Values.alertExpiry.staleAfter | quote }}
  PROMVIEW_ALERT_EXPIRY_INTERVAL: {{ .Values.alertExpiry.interval | quote }}
  PROMVIEW_RECONCILE_INTERVAL: {{ .Values.reconcile.interval | quote }}
  PROMVIEW_RECONCILE_TIMEOUT: {{ .Values.reconcile.timeout | quote }}
  PROMVIEW_SILENCE_DEFAULT_DURATION: {{ .Values.silence.defaultDuration | quote }}
  PROMVIEW_SILENCE_MAX_DURATION: {{ .Values.silence.maxDuration | quote }}
  # Empty disables the endpoint, which is how metrics.enabled is honoured: the
  # port would otherwise still be listening whatever the chart said.
  PROMVIEW_METRICS_ADDRESS: {{ if .Values.metrics.enabled }}{{ printf ":%v" .Values.metrics.port | quote }}{{ else }}""{{ end }}
  {{- if eq .Values.auth.mode "oidc" }}
  PROMVIEW_OIDC_ISSUER_URL: {{ .Values.oidc.issuerURL | quote }}
  PROMVIEW_OIDC_CLIENT_ID: {{ .Values.oidc.clientID | quote }}
  PROMVIEW_OIDC_REDIRECT_URL: {{ .Values.oidc.redirectURL | quote }}
  PROMVIEW_OIDC_SCOPES: {{ join "," .Values.oidc.scopes | quote }}
  PROMVIEW_OIDC_USERNAME_CLAIM: {{ .Values.oidc.usernameClaim | quote }}
  PROMVIEW_OIDC_EMAIL_CLAIM: {{ .Values.oidc.emailClaim | quote }}
  PROMVIEW_OIDC_DISPLAY_NAME_CLAIM: {{ .Values.oidc.displayNameClaim | quote }}
  PROMVIEW_OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | quote }}
  PROMVIEW_OIDC_COOKIE_SECURE: {{ .Values.oidc.cookieSecure | quote }}
  {{- end }}
  {{- if .Values.bootstrapSource.enabled }}
  PROMVIEW_BOOTSTRAP_SOURCE_SLUG: {{ .Values.bootstrapSource.slug | quote }}
  PROMVIEW_BOOTSTRAP_SOURCE_NAME: {{ default .Values.bootstrapSource.slug .Values.bootstrapSource.name | quote }}
  {{- end }}
