replicaCount: 1

image:
  repository: cropalato/promview
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

database:
  existingSecret: promview-database
  urlKey: url

auth:
  mode: open

oidc:
  issuerURL: ""
  clientID: ""
  existingSecret: ""
  clientSecretKey: client-secret
  redirectURL: ""
  scopes:
    - openid
    - profile
    - email
    - groups
  usernameClaim: preferred_username
  emailClaim: email
  displayNameClaim: name
  groupsClaim: groups
  cookieSecure: true

bootstrapSource:
  enabled: false
  slug: ""
  name: ""
  existingSecret: ""
  tokenKey: token

roleBindings: []
# - name: promview-administrators
#   role: administrator
#   oidcIssuer: https://identity.example.com
#   oidcGroup: promview-administrators
# - name: platform-operators
#   role: operator
#   oidcIssuer: https://identity.example.com
#   oidcGroup: promview-operators
#   selectors:
#     - team=platform

# Alerts whose source stops reporting them without a resolved notification are
# marked expired after this window. It must exceed the source Alertmanager's
# repeat_interval; "0" disables expiry. Per-source overrides live in the database.
alertExpiry:
  staleAfter: 12h
  interval: 1m

# Reading each source's Alertmanager confirms what is still firing, which is the
# only way to learn that a silenced alert ended. Sources carry their own URL in
# the database; "0" disables the loop entirely.
reconcile:
  interval: 1m
  timeout: 10s

# Silencing an alert or group writes to the source's Alertmanager. Every silence
# expires: defaultDuration is what an operator gets without choosing, and
# maxDuration caps what they may ask for. Per-source Alertmanager credentials
# live in the database, not here.
silence:
  defaultDuration: 2h
  maxDuration: 720h

# Promview reports on itself: request outcomes, whether reconciliation is still
# running, and whether silences reach their Alertmanager. See docs/metrics.md.
#
# The endpoint is a listener of its own and is never added to the Service or the
# Ingress, so enabling it does not expose anything publicly. Prometheus is
# expected to scrape the pod, which the annotations below ask it to do.
metrics:
  enabled: true
  port: 9090
  # Set podAnnotations yourself if your Prometheus discovers by a different
  # convention, or use a ServiceMonitor pointing at the pod.
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  annotations: {}
  resources: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: promview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources: {}

probes:
  startup:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 20

podDisruptionBudget:
  enabled: false
  minAvailable: 1

helmTest:
  enabled: true

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
