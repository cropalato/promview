replicaCount: 1

image:
  repository: cropalato/promview
  pullPolicy: IfNotPresent
  tag: ""
  digest: ""
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

database:
  existingSecret: promview-database
  urlKey: url

auth:
  mode: open
  # Marks the session cookie Secure. Unset falls back to oidc.cookieSecure,
  # which is the name it shipped under while OIDC was the only mode issuing a
  # session. May be false only on loopback hosts.
  sessionCookieSecure: null

oidc:
  issuerURL: ""
  clientID: ""
  existingSecret: ""
  clientSecretKey: client-secret
  redirectURL: ""
  scopes:
    - openid
    - profile
    - email
    - groups
  usernameClaim: preferred_username
  emailClaim: email
  displayNameClaim: name
  groupsClaim: groups
  # Deprecated: use auth.sessionCookieSecure. Removed in 0.2.0.
  cookieSecure: true

ldap:
  # ldaps://, or ldap:// with startTLS, or a loopback host. Search-then-bind
  # sends the user's own password to the directory, so cleartext to a remote
  # host is refused.
  url: ""
  # What group bindings are written against. Defaults to url; set it separately
  # so moving or renaming a server does not stop every binding matching.
  issuer: ""
  bindDN: ""
  existingSecret: ""
  bindPasswordKey: bind-password
  baseDN: ""
  # One %s, replaced by the escaped username. (sAMAccountName=%s) for Active
  # Directory.
  userFilter: "(uid=%s)"
  groupAttribute: memberOf
  # Find groups by searching for the user instead of reading memberOf off their
  # entry. memberOf is an overlay plenty of OpenLDAP and FreeIPA installations
  # do not enable, and without this a sign-in there succeeds with no groups at
  # all - which reads to the operator as "your account has no access" rather
  # than "promview cannot see your groups". Empty leaves it off.
  groupBaseDN: ""
  # One %s, replaced by the escaped user DN.
  groupFilter: "(member=%s)"
  groupNameAttribute: cn
  # cn stores a group's common name, dn its full distinguished name. Bindings
  # must be written in whichever form is stored; `promview access inspect`
  # shows what a directory actually reported.
  groupFormat: cn
  usernameAttribute: uid
  emailAttribute: mail
  displayNameAttribute: cn
  startTLS: false
  timeout: 10s

bootstrapSource:
  enabled: false
  slug: ""
  name: ""
  existingSecret: ""
  tokenKey: token

# Sources registered on every install and upgrade, one Job per entry running
# `promview source set`. Unlike bootstrapSource this overwrites the stored
# ingestion token, so rotating the Secret and upgrading rotates the credential.
# Tokens live in an existing Secret; the key defaults to the slug so one Secret
# can carry every source.
sources: []
# - slug: production
#   name: Production Alertmanager   # defaults to slug
#   existingSecret: promview-sources
#   tokenKey: production            # defaults to slug
#   staleAfter: 12h                 # optional; empty keeps the stored value
#   alertmanagerURL: http://alertmanager.monitoring:9093  # optional
#   alertmanagerTokenKey: production-am                   # optional, same Secret

roleBindings: []
# - name: promview-administrators
#   role: administrator
#   issuer: https://identity.example.com
#   group: promview-administrators
# - name: platform-operators
#   role: operator
#   issuer: https://identity.example.com
#   group: promview-operators
#   selectors:
#     - team=platform

# Alerts whose source stops reporting them without a resolved notification are
# marked expired after this window. It must exceed the source Alertmanager's
# repeat_interval; "0" disables expiry. Per-source overrides live in the database.
alertExpiry:
  staleAfter: 12h
  interval: 1m

# Stream events exist so a client that lost its connection can resume, and are
# deleted once they are older than this. A client resuming from a cursor already
# deleted is told to take a fresh snapshot rather than being handed an
# incomplete stream. "0" keeps every event forever.
stream:
  retention: 24h

# Reading each source's Alertmanager confirms what is still firing, which is the
# only way to learn that a silenced alert ended. Sources carry their own URL in
# the database; "0" disables the loop entirely.
reconcile:
  interval: 1m
  timeout: 10s

# Silencing an alert or group writes to the source's Alertmanager. Every silence
# expires: defaultDuration is what an operator gets without choosing, and
# maxDuration caps what they may ask for. Per-source Alertmanager credentials
# live in the database, not here.
silence:
  defaultDuration: 2h
  maxDuration: 720h

# Promview reports on itself: request outcomes, whether reconciliation is still
# running, and whether silences reach their Alertmanager. See docs/metrics.md.
#
# The endpoint is a listener of its own and is never added to the Service or the
# Ingress, so enabling it does not expose anything publicly. Prometheus is
# expected to scrape the pod, which the annotations below ask it to do.
metrics:
  enabled: true
  port: 9090

  # A ServiceMonitor is rendered only where the Prometheus Operator's CRD
  # exists. A cluster without it is handed the scrape annotations instead, so
  # enabling this cannot leave a deployment with neither.
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Prometheus selects ServiceMonitors by label, and the selector is set by
    # whoever installed it. kube-prometheus-stack commonly wants
    # `release: <its release name>`; without a match this object is created,
    # ignored, and nothing says so. Check before assuming it is being scraped.
    labels: {}
    honorLabels: false
    relabelings: []
    metricRelabelings: []

  # An alert on the one failure promview cannot report itself. See the template
  # for why this specific rule and not a fuller set.
  prometheusRule:
    enabled: true
    # Prometheus selects PrometheusRules by label the same way it selects
    # ServiceMonitors, and the selector belongs to whoever installed it.
    labels: {}
    # Seconds without a successful reconciliation pass before alerting. The
    # comparison is arithmetic, so this is a number rather than a duration.
    # Fifteen minutes is fifteen missed passes at the default interval - long
    # enough that a restart or a brief outage does not page anyone.
    reconcileStaleAfter: 900
    for: 5m
    severity: warning
    # Appended to the same group, so a deployment can add its own without
    # needing a second PrometheusRule object.
    additionalRules: []

  # Extra pod annotations. The prometheus.io/* trio is added by the Deployment
  # itself, with the port taken from metrics.port above, and only when no
  # ServiceMonitor is rendered - two discovery paths at once would scrape the
  # same pod twice under different job names.
  annotations: {}

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 900
  annotations: {}
  resources: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: promview.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources: {}

probes:
  startup:
    enabled: true
    periodSeconds: 2
    timeoutSeconds: 2
    failureThreshold: 60
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 20

podDisruptionBudget:
  enabled: false
  minAvailable: 1

helmTest:
  enabled: true

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
