[package]
name = "promview-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Tauri shell around the Promview console"
license = "MIT"
publish = false

[lib]
name = "promview_desktop_lib"
crate-type = ["lib"]
path = "src/lib.rs"

[[bin]]
name = "promview-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
# The shell is a thin wrapper around a webview; the smaller binary matters more
# than the last few percent of speed.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
