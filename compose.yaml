services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promview
      POSTGRES_USER: promview
      POSTGRES_PASSWORD: promview
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promview -d promview"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: &app-environment
      PROMVIEW_DATABASE_URL: postgres://promview:promview@postgres:5432/promview?sslmode=disable
      PROMVIEW_BOOTSTRAP_SOURCE_SLUG: demo
      PROMVIEW_BOOTSTRAP_SOURCE_NAME: Development Alertmanager
      PROMVIEW_BOOTSTRAP_SOURCE_TOKEN: development-token
      PROMVIEW_AUTH_MODE: ${PROMVIEW_AUTH_MODE:-open}
      PROMVIEW_OIDC_ISSUER_URL: ${PROMVIEW_OIDC_ISSUER_URL:-}
      PROMVIEW_OIDC_CLIENT_ID: ${PROMVIEW_OIDC_CLIENT_ID:-}
      PROMVIEW_OIDC_CLIENT_SECRET: ${PROMVIEW_OIDC_CLIENT_SECRET:-}
      PROMVIEW_OIDC_REDIRECT_URL: ${PROMVIEW_OIDC_REDIRECT_URL:-}
      PROMVIEW_OIDC_SCOPES: ${PROMVIEW_OIDC_SCOPES:-openid,profile,email,groups}
      PROMVIEW_OIDC_USERNAME_CLAIM: ${PROMVIEW_OIDC_USERNAME_CLAIM:-preferred_username}
      PROMVIEW_OIDC_EMAIL_CLAIM: ${PROMVIEW_OIDC_EMAIL_CLAIM:-email}
      PROMVIEW_OIDC_DISPLAY_NAME_CLAIM: ${PROMVIEW_OIDC_DISPLAY_NAME_CLAIM:-name}
      PROMVIEW_OIDC_GROUPS_CLAIM: ${PROMVIEW_OIDC_GROUPS_CLAIM:-groups}
      PROMVIEW_OIDC_VIEWER_GROUPS: ${PROMVIEW_OIDC_VIEWER_GROUPS:-}
      PROMVIEW_OIDC_OPERATOR_GROUPS: ${PROMVIEW_OIDC_OPERATOR_GROUPS:-}
      PROMVIEW_OIDC_ADMIN_GROUPS: ${PROMVIEW_OIDC_ADMIN_GROUPS:-}
      PROMVIEW_OIDC_COOKIE_SECURE: ${PROMVIEW_OIDC_COOKIE_SECURE:-true}

  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *app-environment
    ports:
      - "8080:8080"

volumes:
  postgres-data:
